<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trash Tide</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Optional fallback if .hidden is not defined in your CSS */
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Quiz Popup -->
    <div id="quizPopup" class="hidden">
      <div class="quiz-box">
        <p id="quizQuestion">Question goes here...</p>
        <div id="quizAnswers"></div>
      </div>
    </div>

    <!-- Feedback Popup) -->
    <div id="feedbackPopup" class="hidden">
      <!-- Dynamically updated content -->
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="hidden">
      <div class="go-box">
        <h1>Game Over</h1>
        <p id="finalScore">Final Score: 0</p>
        <button id="restartBtn">Restart Game</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
